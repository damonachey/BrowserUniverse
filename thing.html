<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Browser Universe</title>
  <style>
    body {
      background-color: #3b4a5a;
      color: #eef1f4;
      font-family: system-ui, sans-serif;
    }

    a {
      color: inherit;
    }

    section {
      margin-top: 1.5em;
    }

    ul {
      margin: 0;
      padding-left: 1.2em;
    }

    .prop-row {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 4px 16px;
      align-items: center;
      margin-bottom: 4px;
    }

    .prop-row label {
      font-weight: bold;
    }

    .prop-row input {
      justify-self: start;
    }
  </style>
</head>
<body>
  <p><a href="index.html">&larr; Back to all things</a></p>
  <div id="content"></div>

  <script type="module">
    import { getThing, updateThing } from './src/db.js';

    const contentEl = document.getElementById('content');

    function renderProperties(properties, onSave) {
      const form = document.createElement('form');
      const inputs = {};

      for (const key of Object.keys(properties)) {
        const row = document.createElement('div');
        row.className = 'prop-row';

        const label = document.createElement('label');
        label.textContent = key;
        row.appendChild(label);

        const input = document.createElement('input');
        input.size = 80;
        input.value = properties[key];
        inputs[key] = input;
        row.appendChild(input);

        form.appendChild(row);
      }

      const saveBtn = document.createElement('button');
      saveBtn.type = 'submit';
      saveBtn.textContent = 'Save';
      form.appendChild(saveBtn);

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const updated = { ...properties };
        for (const key of Object.keys(inputs)) {
          updated[key] = inputs[key].value;
        }
        onSave(updated);
      });

      return form;
    }

    function renderList(items) {
      if (items.length === 0) return '<p>None</p>';
      const ul = document.createElement('ul');
      for (const item of items) {
        const li = document.createElement('li');
        li.textContent = String(item);
        ul.appendChild(li);
      }
      return ul;
    }

    function describeEvent(event) {
      if (event.action === 'created') return 'Created';
      if (event.action === 'property changed') return `Property '${event.property}' changed to '${event.value}'`;
      return event.action;
    }

    function renderEvents(events) {
      if (events.length === 0) return '<p>None</p>';
      const ul = document.createElement('ul');
      for (const event of [...events].reverse()) {
        const li = document.createElement('li');
        li.textContent = `${new Date(event.timestamp).toLocaleString()} — ${describeEvent(event)}`;
        ul.appendChild(li);
      }
      return ul;
    }

    function renderSection(title, node) {
      const section = document.createElement('section');
      const h2 = document.createElement('h2');
      h2.textContent = title;
      section.appendChild(h2);
      section.append(node instanceof Node ? node : document.createRange().createContextualFragment(node));
      return section;
    }

    async function render() {
      const id = new URLSearchParams(location.search).get('id');
      const thing = id ? await getThing(id) : null;
      if (!thing) {
        contentEl.innerHTML = `<h1>Thing not found</h1>`;
        return;
      }

      document.title = `${thing.properties.name} - Browser Universe`;

      contentEl.innerHTML = '';
      const h1 = document.createElement('h1');
      h1.textContent = thing.properties.name;
      contentEl.appendChild(h1);

      const idRow = document.createElement('p');
      idRow.innerHTML = `<strong>Id:</strong> ${thing.id}`;
      contentEl.appendChild(idRow);

      contentEl.appendChild(renderSection('Properties', renderProperties(thing.properties, async (updated) => {
        thing.properties = updated;
        await updateThing(thing);
        render();
      })));
      contentEl.appendChild(renderSection('Relationships', renderList(thing.relationships)));
      contentEl.appendChild(renderSection('Events', renderEvents(thing.events)));
      contentEl.appendChild(renderSection('Behaviors', renderList(thing.behaviors)));
    }

    render();
  </script>
</body>
</html>
