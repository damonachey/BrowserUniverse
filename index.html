<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BrowserUniverse</title>
  <style>
    body {
      background-color: #3b4a5a;
      color: #eef1f4;
      font-family: system-ui, sans-serif;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.15s ease;
    }

    .delete-btn:hover {
      opacity: 1;
    }

    table {
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 4px 12px 4px 0;
    }
  </style>
</head>
<body>
  <h1>BrowserUniverse</h1>

  <button id="create-thing">Create Thing</button>
  <button id="reset-things">Reset</button>
  <table>
    <thead>
      <tr>
        <th></th>
        <th>Id</th>
        <th>Name</th>
        <th>Properties</th>
        <th>Relationships</th>
        <th>Events</th>
        <th>Behaviors</th>
        <th>Permissions</th>
      </tr>
    </thead>
    <tbody id="thing-list"></tbody>
  </table>

  <script type="module">
    import { createThing, getAllThings, deleteThing, resetAll } from './src/db.js';
    import { randomName } from './src/randomName.js';

    const listEl = document.getElementById('thing-list');
    const createBtn = document.getElementById('create-thing');
    const resetBtn = document.getElementById('reset-things');

    async function refreshList() {
      const things = await getAllThings();
      listEl.innerHTML = '';
      for (const thing of things) {
        const tr = document.createElement('tr');

        const deleteCell = document.createElement('td');
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '🗑️';
        deleteBtn.title = 'Delete';
        deleteBtn.addEventListener('click', async () => {
          await deleteThing(thing.id);
          refreshList();
        });
        deleteCell.appendChild(deleteBtn);

        const idCell = document.createElement('td');
        idCell.textContent = thing.id;

        const nameCell = document.createElement('td');
        nameCell.textContent = thing.properties.name;

        const propertiesCell = document.createElement('td');
        propertiesCell.textContent = Object.keys(thing.properties).length;

        const relationshipsCell = document.createElement('td');
        relationshipsCell.textContent = thing.relationships.length;

        const eventsCell = document.createElement('td');
        eventsCell.textContent = thing.events.length;

        const behaviorsCell = document.createElement('td');
        behaviorsCell.textContent = thing.behaviors.length;

        const permissionsCell = document.createElement('td');
        permissionsCell.textContent = Object.keys(thing.permissions).length;

        tr.append(
          deleteCell, idCell, nameCell,
          propertiesCell, relationshipsCell, eventsCell, behaviorsCell, permissionsCell,
        );
        listEl.appendChild(tr);
      }
    }

    createBtn.addEventListener('click', async () => {
      await createThing(randomName());
      refreshList();
    });

    resetBtn.addEventListener('click', async () => {
      if (confirm('Remove all things and reset the next id to 1?')) {
        await resetAll();
        refreshList();
      }
    });

    refreshList();
  </script>
</body>
</html>
