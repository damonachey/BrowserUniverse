<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Browser Universe</title>
  <style>
    body {
      background-color: #3b4a5a;
      color: #eef1f4;
      font-family: system-ui, sans-serif;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.15s ease;
    }

    .delete-btn:hover {
      opacity: 1;
    }

    table {
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 4px 12px 4px 0;
    }
  </style>
</head>
<body>
  <h1>Browser Universe</h1>

  <button id="create-thing">Create Thing</button>
  <table>
    <thead>
      <tr>
        <th></th>
        <th>Name</th>
        <th>Properties</th>
        <th>Relationships</th>
        <th>Events</th>
        <th>Behaviors</th>
      </tr>
    </thead>
    <tbody id="thing-list"></tbody>
  </table>

  <button id="reset-things">Reset</button>
  <p><a href="stats.html">Statistics</a></p>

  <script type="module">
    import { createThing, getAllThings, deleteThing, resetAll } from './src/db.js';
    import { randomName } from './src/randomName.js';

    const listEl = document.getElementById('thing-list');
    const createBtn = document.getElementById('create-thing');
    const resetBtn = document.getElementById('reset-things');

    async function refreshList() {
      const things = await getAllThings();
      listEl.innerHTML = '';
      for (const thing of things) {
        const tr = document.createElement('tr');

        const deleteCell = document.createElement('td');
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '🗑️';
        deleteBtn.title = 'Delete';
        deleteBtn.addEventListener('click', async () => {
          await deleteThing(thing.id);
          refreshList();
        });
        deleteCell.appendChild(deleteBtn);

        const nameCell = document.createElement('td');
        const nameLink = document.createElement('a');
        nameLink.href = `thing.html?id=${thing.id}`;
        nameLink.textContent = thing.properties.name;
        nameLink.style.color = 'inherit';
        nameCell.appendChild(nameLink);

        const propertiesCell = document.createElement('td');
        propertiesCell.textContent = Object.keys(thing.properties).length;

        const relationshipsCell = document.createElement('td');
        relationshipsCell.textContent = thing.relationships.length;

        const eventsCell = document.createElement('td');
        eventsCell.textContent = thing.events.length;

        const behaviorsCell = document.createElement('td');
        behaviorsCell.textContent = thing.behaviors.length;

        tr.append(
          deleteCell, nameCell,
          propertiesCell, relationshipsCell, eventsCell, behaviorsCell,
        );
        listEl.appendChild(tr);
      }
    }

    createBtn.addEventListener('click', async () => {
      await createThing(randomName());
      refreshList();
    });

    resetBtn.addEventListener('click', async () => {
      if (confirm('Remove all things?')) {
        await resetAll();
        refreshList();
      }
    });

    refreshList();
  </script>
</body>
</html>
